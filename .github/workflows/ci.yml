name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==============================================================================
  # Lint and format checks
  # ==============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Run rustfmt
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --exclude hdf5-src -- -D warnings

  # ==============================================================================
  # Test on Linux with system HDF5
  # ==============================================================================
  test-linux:
    name: Linux (system HDF5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Build
        run: cargo build --workspace --exclude hdf5-src

      - name: Test
        run: cargo test --workspace --exclude hdf5-src

  # ==============================================================================
  # Test with statically linked HDF5
  # ==============================================================================
  test-static:
    name: Static HDF5
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with: {submodules: true}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and test
        run: cargo test --features hdf5-sys/static,hdf5-sys/zlib

  # ==============================================================================
  # Test MSRV
  # ==============================================================================
  test-msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: true}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92'

      - name: Build and test
        run: cargo test --workspace --exclude hdf5-src --features hdf5-sys/static,hdf5-sys/zlib

  # ==============================================================================
  # Documentation build
  # ==============================================================================
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: true}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Build documentation
        env:
          RUSTDOCFLAGS: --cfg docsrs
        run: cargo doc --features static,zlib,blosc,lzf,f16,complex --no-deps

  # ==============================================================================
  # Test with optional features
  # ==============================================================================
  test-features:
    name: Features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: true}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Test with lzf and blosc
        run: cargo test --workspace --exclude hdf5-src --features lzf,blosc,f16,complex
