[package]
name = "hdf5-sys"
build = "build.rs"
description = "Native bindings to the HDF5 library."
links = "hdf5"
readme = "README.md"
categories = ["ffi", "filesystem", "science"]
version.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true

[dependencies]
libc = { workspace = true }
mpi-sys = { workspace = true, optional = true }
libz-sys = { workspace = true, optional = true }
hdf5-src = { workspace = true, optional = true }

# Please see README for further explanation of these feature flags
[features]
default = []
mpio = ["dep:mpi-sys"]
hl = ["hdf5-src?/hl"]
threadsafe = ["hdf5-src?/threadsafe"]
zlib = ["libz-sys", "hdf5-src?/zlib"]
static = ["dep:hdf5-src"]
deprecated = ["hdf5-src?/deprecated"]

[build-dependencies]
libloading = "0.8"
regex = { workspace = true }

[target.'cfg(any(all(unix, not(target_os = "macos")), windows))'.build-dependencies]
pkg-config = "0.3"

[target.'cfg(windows)'.build-dependencies]
serde = "1.0"
serde_derive = "1.0"
winreg = { version = "0.52", features = ["serialization-serde"] }

[package.metadata.docs.rs]
features = ["static", "zlib"]

[lints.rust]
# These cfg conditions are set dynamically by the build script based on HDF5 version
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(have_stdbool_h)',
    'cfg(hdf5_1_8_4)', 'cfg(hdf5_1_8_5)', 'cfg(hdf5_1_8_6)', 'cfg(hdf5_1_8_7)', 'cfg(hdf5_1_8_8)',
    'cfg(hdf5_1_8_9)', 'cfg(hdf5_1_8_10)', 'cfg(hdf5_1_8_11)', 'cfg(hdf5_1_8_12)', 'cfg(hdf5_1_8_13)',
    'cfg(hdf5_1_8_14)', 'cfg(hdf5_1_8_15)', 'cfg(hdf5_1_8_16)', 'cfg(hdf5_1_8_17)', 'cfg(hdf5_1_8_18)',
    'cfg(hdf5_1_8_19)', 'cfg(hdf5_1_8_20)', 'cfg(hdf5_1_8_21)',
    'cfg(hdf5_1_10_0)', 'cfg(hdf5_1_10_1)', 'cfg(hdf5_1_10_2)', 'cfg(hdf5_1_10_3)', 'cfg(hdf5_1_10_4)',
    'cfg(hdf5_1_10_5)', 'cfg(hdf5_1_10_6)', 'cfg(hdf5_1_10_7)', 'cfg(hdf5_1_10_8)', 'cfg(hdf5_1_10_9)', 'cfg(hdf5_1_10_10)',
    'cfg(hdf5_1_12_0)', 'cfg(hdf5_1_12_1)', 'cfg(hdf5_1_12_2)',
    'cfg(hdf5_1_14_0)', 'cfg(hdf5_1_14_1)', 'cfg(hdf5_1_14_2)', 'cfg(hdf5_1_14_3)', 'cfg(hdf5_1_14_4)',
    'cfg(hdf5_2_0_0)', 'cfg(hdf5_2_0_1)', 'cfg(hdf5_2_0_2)', 'cfg(hdf5_2_0_3)',
    'cfg(feature, values("have-parallel", "have-direct"))',
    'cfg(feature, values("1.8.4", "1.8.5", "1.8.6", "1.8.7", "1.8.8", "1.8.9", "1.8.10", "1.8.11", "1.8.12", "1.8.13", "1.8.14", "1.8.15", "1.8.16", "1.8.17", "1.8.18", "1.8.19", "1.8.20", "1.8.21"))',
    'cfg(feature, values("1.10.0", "1.10.1", "1.10.2", "1.10.3", "1.10.4", "1.10.5", "1.10.6", "1.10.7", "1.10.8", "1.10.9", "1.10.10"))',
    'cfg(feature, values("1.12.0", "1.12.1", "1.12.2"))',
    'cfg(feature, values("1.14.0", "1.14.1", "1.14.2", "1.14.3", "1.14.4"))',
    'cfg(feature, values("2.0.0", "2.0.1", "2.0.2", "2.0.3"))',
] }
