[package]
name = "hdf5"
readme = "../README.md"
description = "Thread-safe Rust bindings for the HDF5 library."
build = "build.rs"
categories = ["science", "filesystem"]
version.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true

[features]
default = []
# Compile and statically link bundled HDF5 library.
static = ["hdf5-sys/static"]
# Enable zlib compression filter.
zlib = ["hdf5-sys/zlib"]
# Enable LZF compression filter.
lzf = ["dep:lzf-sys", "dep:errno"]
# Enable blosc compression filters.
blosc = ["dep:blosc-sys"]
# Enable MPI support.
mpio = ["dep:mpi-sys", "hdf5-sys/mpio"]
# Enable complex number type support.
complex = ["hdf5-types/complex"]
# Enable float16 type support.
f16 = ["hdf5-types/f16"]

# The features with version numbers such as 1.10.3, 1.12.0 are metafeatures
# and is only available when the HDF5 library is at least this version.
# Features have_direct and have_parallel are also metafeatures and dependent
# on the HDF5 library which is linked against.

[dependencies]
# external
bitflags = "2.6"
tracing = "0.1"
blosc-sys = { version = "0.3", package = "blosc-src", optional = true }
cfg-if = { workspace = true }
errno = { version = "0.3", optional = true }
libc = { workspace = true }
lzf-sys = { version = "0.1", optional = true }
mpi-sys = { workspace = true, optional = true }
ndarray = "0.16"
parking_lot = "0.12"
paste = "1.0"
# internal
hdf5-derive = { workspace = true }
hdf5-sys = { workspace = true }
hdf5-types = { workspace = true }

[dev-dependencies]
half = { workspace = true }
num-complex = { workspace = true }
paste = "1.0"
pretty_assertions = "1.4"
rand = { version = "0.8", features = ["small_rng"] }
regex = { workspace = true }
scopeguard = "1.2"
tempfile = "3.9"

[package.metadata.docs.rs]
features = ["static", "zlib", "blosc", "lzf", "f16", "complex"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
# These cfg conditions are set dynamically by build script based on HDF5 version
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(msvc_dll_indirection)',
    'cfg(docrs)',
    'cfg(feature, values("have-parallel", "have-direct", "have-filter-deflate"))',
    'cfg(feature, values("1.8.4", "1.8.5", "1.8.6", "1.8.7", "1.8.8", "1.8.9", "1.8.10", "1.8.11", "1.8.12", "1.8.13", "1.8.14", "1.8.15", "1.8.16", "1.8.17", "1.8.18", "1.8.19", "1.8.20", "1.8.21"))',
    'cfg(feature, values("1.10.0", "1.10.1", "1.10.2", "1.10.3", "1.10.4", "1.10.5", "1.10.6", "1.10.7", "1.10.8", "1.10.9", "1.10.10"))',
    'cfg(feature, values("1.12.0", "1.12.1", "1.12.2"))',
    'cfg(feature, values("1.14.0", "1.14.1", "1.14.2", "1.14.3", "1.14.4"))',
] }
# Allow non-camel-case type names for HDF5 driver types (H5FD_*)
non_camel_case_types = "allow"
# Allow non-local impl from derive macros in tests
non_local_definitions = "allow"
